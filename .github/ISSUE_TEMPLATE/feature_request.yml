name: Feature request
description: Suggest something Hetzner Dock should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe the situation and what is missing today, from the point of view of the admin or the user.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Your idea for the feature. Links to the matching Hetzner Cloud API endpoint (https://docs.hetzner.cloud/) or Robot webservice call (https://robot.hetzner.com/doc/webservice/en.html) help a lot.
  - type: dropdown
    id: who
    attributes:
      label: Who is it for?
      options:
        - Admins
        - Users the servers are shared with
        - Both
